# https://github.com/mpv-player/mpv/blob/master/etc/mpv.conf
# https://mpv.io/manual/stable/

autofit-larger=100%x95%
autofit-smaller=20%x20%
demuxer-max-back-bytes=128MiB
demuxer-max-bytes=512MiB
msg-module
term-osd-bar

# OSC
osc=no
osd-bar-w=25
osd-bar-h=0.4
osd-bar-outline-size=0
osd-bar-marker-style=line
border=no
osd-font=FiraCode Nerd Font
osd-font-size=16
osd-outline-size=1

# Nvidia+Wayland
hwdec=nvdec
gpu-api=opengl
gpu-context=wayland
