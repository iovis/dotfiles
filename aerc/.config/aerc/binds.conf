# Original: /usr/share/aerc/binds.conf

# Binds are of the form <key sequence> = <command to run>
# To use '=' in a key sequence, substitute it with "Eq": "<Ctrl+Eq>"
# If you wish to bind #, you can wrap the key sequence in quotes: "#" = quit
<A-h> = :prev-tab<Enter>
<A-l> = :next-tab<Enter>
? = :help keys<Enter>
<C-r> = :reload<Enter>
<C-c> = :quit<Enter>
<C-q> = :quit<Enter>
<C-z> = :suspend<Enter>
<semicolon> = :

[messages]
<C-s> = :check-mail<Enter>
q = :quit<Enter>

j = :next<Enter>
<C-d> = :next 50%<Enter>
<C-f> = :next 100%<Enter>

k = :prev<Enter>
<C-u> = :prev 50%<Enter>
<C-b> = :prev 100%<Enter>
gg = :select 0<Enter>
G = :select -1<Enter>

o = :menu -d :cf<Enter>
gi = :cf "INBOX"<Enter>
ga = :cf "[Gmail]/All Mail"<Enter>
gd = :cf "[Gmail]/Trash"<Enter>
gs = :cf "[Gmail]/Sent Mail"<Enter>
gx = :cf "[Gmail]/Spam"<Enter>

<C-j> = :next-folder<Enter>
<C-k> = :prev-folder<Enter>

<A-a> = :mark -a<Enter>
<A-d> = :unmark -a<Enter>
<A-t> = :mark -at<Enter>
<Space> = :mark -t<Enter>
v = :mark -v<Enter>

T = :toggle-threads<Enter>
zc = :fold<Enter>
zo = :unfold<Enter>
za = :fold -t<Enter>
zM = :fold -a<Enter>
zR = :unfold -a<Enter>
<tab> = :fold -t<Enter>

zz = :align center<Enter>
zt = :align top<Enter>
zb = :align bottom<Enter>

<Enter> = :view<Enter>
l = :view<Enter>
d = :choose -o y 'Permanently delete' delete-message<Enter>
D = :delete<Enter>
a = :read<Enter>:archive flat<Enter>
A = :unmark -a<Enter>:mark -T<Enter>:read<Enter>:archive flat<Enter>
m = :menu -d :move<Enter>
J = :read<Enter>:move [Gmail]/Spam<Enter>
u = :read -t<Enter>
* = :flag -t<Enter>

c = :compose<Enter>
b = :bounce<space>
F = :forward<Enter>
r = :reply -aq<Enter>
R = :reply -q<Enter>

| = :pipe<space>

f<space> = :filter -
ff = :forward<Enter>
fk = :clear<Enter>
fu = :filter -u<Enter>
fl = :filter -x flagged<Enter>

/ = :search<space>
n = :next-result<Enter>
N = :prev-result<Enter>
<Esc> = :clear<Enter>

s = :split<Enter>
S = :vsplit<Enter>

# Scroll within message viewer
<A-j> = :send-keys j<Enter>
<A-k> = :send-keys k<Enter>
<A-.> = :send-keys \<C-d\><Enter>
<A-,> = :send-keys \<C-u\><Enter>

[messages:account=Personal]
d = :read<Enter>:move [Gmail]/Trash<Enter>
D = :read<Enter>:move [Gmail]/Trash<Enter>

[messages:folder=(Spam|Trash)$]
d = :delete<Enter>
D = :delete<Enter>

[messages:folder=Drafts]
<Enter> = :recall<Enter>
l = :recall<Enter>

[view]
"`" = :toggle-key-passthrough<Enter>
/ = :toggle-key-passthrough<Enter>/
q = :close<Enter>
h = :close<Enter>

o = :open<Enter>
O = :menu -l :open-link<Enter>
s = :save<Enter>
S = :save -a<Enter>
| = :pipe<space>
D = :delete<Enter>
A = :read<Enter>:archive flat<Enter>
J = :read<Enter>:move [Gmail]/Spam<Enter>

<C-y> = :copy-link <space>
<C-l> = :open-link <space>

F = :forward<Enter>
r = :reply -aq<Enter>
R = :reply -q<Enter>

H = :toggle-headers<Enter>
<C-j> = :next<Enter>
<C-k> = :prev<Enter>
<A-k> = :prev-part<Enter>
<A-j> = :next-part<Enter>

[view:account=Personal]
D = :read<Enter>:move [Gmail]/Trash<Enter>

[view:folder=(Spam|Trash)$]
D = :delete<Enter>

[view::passthrough]
$noinherit = true
$ex = <C-x>
"`" = :toggle-key-passthrough<Enter>
<Esc> = :toggle-key-passthrough<Enter>

[compose]
# Keybindings used when the embedded terminal is not selected in the compose view
$noinherit = true
$ex = <C-x>
$complete = <C-o>
<C-c> = :abort<Enter>
<C-k> = :prev-field<Enter>
<C-j> = :next-field<Enter>
<tab> = :next-field<Enter>
<backtab> = :prev-field<Enter>
<A-h> = :prev-tab<Enter>
<A-l> = :next-tab<Enter>
<A-p> = :switch-account -p<Enter>
<A-n> = :switch-account -n<Enter>

[compose::editor]
# Keybindings used when the embedded terminal is selected in the compose view
$noinherit = true
$ex = <C-x>
<C-k> = :prev-field<Enter>
<C-j> = :next-field<Enter>
<A-h> = :prev-tab<Enter>
<A-l> = :next-tab<Enter>

[compose::review]
# Keybindings used when reviewing a message to be sent
# Inline comments are used as descriptions on the review screen
y = :send<Enter> # Send
n = :abort<Enter> # Abort (discard message, no confirmation)
s = :sign<Enter> # Toggle signing
x = :encrypt<Enter> # Toggle encryption to all recipients
v = :preview<Enter> # Preview message
p = :postpone<Enter> # Postpone
q = :choose -o d discard abort -o p postpone postpone<Enter> # Abort or postpone
e = :edit<Enter> # Edit (body and headers)
a = :attach<space> # Add attachment
d = :detach<space> # Remove attachment

[terminal]
$noinherit = true
$ex = <C-x>

<A-h> = :prev-tab<Enter>
<A-l> = :next-tab<Enter>
