#:schema https://mise.jdx.dev/schema/mise.json

[tools]
deno = "latest"
go = "latest"
node = "lts"
ruby = "latest"
usage = "latest"

[settings]
self_update.auto = false
disable_hints = ["outdated_bump"]
idiomatic_version_file_enable_tools = ["node", "ruby"]

[settings.ruby]
compile = false

[tasks.out]
run = "mise outdated"
quiet = true
alias = "o"
