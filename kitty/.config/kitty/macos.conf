font_family      postscript_name=JetBrainsMono-ExtraLight
bold_font        postscript_name=JetBrainsMono-Bold
italic_font      postscript_name=JetBrainsMono-ExtraLightItalic
bold_italic_font postscript_name=JetBrainsMono-BoldItalic
font_size 20.0

# Nerd Fonts v3.4.0. Keep the regular text font metrics and use Kitty's
# symbols-only font for private-use icon glyphs.
symbol_map U+e000-U+e00a,U+e0a0-U+e0a2,U+e0a3,U+e0b0-U+e0b3,U+e0b4-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ea60-U+ec1e,U+ed00-U+efce,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 JetBrainsMono Nerd Font Mono
narrow_symbols U+e000-U+e00a,U+e0a0-U+e0a2,U+e0a3,U+e0b0-U+e0b3,U+e0b4-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ea60-U+ec1e,U+ed00-U+efce,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 1

macos_option_as_alt yes

map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

map cmd+u remote_control set-background-opacity --toggle 1
map cmd+j kitten hints --type=regex --regex '\b([A-Z]+-\d+)\b' --program "sh -c 'open https://atlassian.net/browse/$1' sh"
